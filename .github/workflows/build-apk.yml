name: Build Debug APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: debug-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          ls -lh app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk FileBridge-debug.apk
          sha256sum FileBridge-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-debug-apk
          path: android/FileBridge-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-debug
          name: "FileBridge v0.1.0 · Debug 安装包"
          body_path: .github/RELEASE_BODY.md
          files: android/FileBridge-debug.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

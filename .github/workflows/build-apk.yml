name: Build APK & Release

on:
  push:
    branches: [main]
    # 沙盒文件中转目录的 commit 不触发重新打包（同步脚本也带 [skip ci]）
    paths-ignore:
      - 'sandbox-files/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-release
  cancel-in-progress: true

env:
  # ---- 版本规则：每出一个包只改这里，APK 名 / tag / 标题全部跟着走 ----
  APP_VERSION: "1.4"
  APK_NAME: "FileBridge-v1.4.apk"
  RELEASE_TAG: "v1.4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source self-check (incl. main-thread guard)
        # v1.4 修复的 NetworkOnMainThreadException 必须靠静态断言防回归：
        # 编译能过不代表网络跑在子线程，真机才会暴露。
        run: python3 ../scripts/check_sources.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head -n 20 || true
          which sdkmanager || true

      - name: Install SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found; downloading command line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed signing certificate
        # 证书存在 Actions Secret 里，不进公开仓库；每个版本都用同一张，可直接覆盖安装
        run: |
          set -e
          echo "${{ secrets.FILEBRIDGE_KEYSTORE_B64 }}" | base64 -d > app/filebridge.jks
          ls -l app/filebridge.jks
          keytool -list -v -keystore app/filebridge.jks \
            -storepass filebridge2026 -alias filebridge 2>/dev/null \
            | grep -E "Owner:|SHA256:" | head -n 4

      - name: Build signed release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Verify signature is fixed & valid
        run: |
          set -e
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk | head -n 20
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build log for debugging
        if: failure()
        run: |
          set -e
          git config user.email "ci@filebridge.local"
          git config user.name "FileBridge CI"
          git checkout -B ci-logs
          mkdir -p ci
          if [ -f gradle-build.log ]; then cp gradle-build.log ci/last-build.log;
          else echo "build log missing" > ci/last-build.log; fi
          git add -f ci/last-build.log
          git commit -m "ci: build log for run ${GITHUB_RUN_ID}" || true
          git push --force origin ci-logs

      - name: Prepare artifact with fixed name
        run: |
          set -e
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "APK=${APK_NAME}"
          echo "v1.3 size: $(stat -c%s "${APK_NAME}") bytes (v1.2 was 6503992)"
          sha256sum "${APK_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-release-apk
          path: android/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 60

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "FileBridge v${{ env.APP_VERSION }}"
          body_path: .github/RELEASE_BODY.md
          files: android/${{ env.APK_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

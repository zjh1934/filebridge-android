name: Build Debug APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: debug-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head -n 20 || true
          which sdkmanager || true
          sdkmanager --version 2>&1 | head -n 5 || true

      - name: Install SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found; downloading command line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          "$SDKM" --version

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare artifact
        run: |
          ls -lh app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk FileBridge-debug.apk
          sha256sum FileBridge-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-debug-apk
          path: android/FileBridge-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-debug
          name: "FileBridge v0.1.0 · Debug 安装包"
          body_path: .github/RELEASE_BODY.md
          files: android/FileBridge-debug.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
